name: Collect Mastodon Server Data

on:
  schedule:
    # Off the hour to avoid GitHub's top-of-hour cron backlog. One snapshot per UTC day is the
    # cadence the 24h and 7d movers are built on.
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      accept_drop:
        description: >-
          One-off: accept a drop of more than 20% in total users, server count or the largest server,
          which the collector otherwise refuses. Check the drop is real first; leave off for normal runs.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Its own group: this workflow commits only data/servers.js, which no other workflow touches, so a
  # concurrent push from update-data rebases cleanly.
  group: collect-servers
  cancel-in-progress: false

jobs:
  collect-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the branch head, not the commit that triggered the run, so a queued run starts
      # from the previous run's data commit and its rebase never conflicts.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Validates before writing and exits non-zero (leaving data/servers.js untouched) when FediDB
      # fails or returns a clearly worse snapshot.
      - name: Collect the server board from FediDB
        env:
          SERVERS_ACCEPT_DROP: ${{ inputs.accept_drop && '1' || '' }}
        run: node scripts/collect-servers.js

      - name: Check the written file parses
        run: node --check data/servers.js

      - name: Commit and push if anything changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/servers.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: server data update (automated)"
          for attempt in 1 2; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            if [ "$attempt" -eq 1 ]; then sleep 15; fi
          done
          echo "::error::Could not push the server data update after 2 attempts."
          exit 1
